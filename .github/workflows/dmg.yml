# SPDX-License-Identifier: GPL-2.0-or-later
# Builds the universal DMG that anyone can download, without a certificate: the app is
# ad-hoc signed (`make-dmg.sh --adhoc`), since Apple Silicon won't run a binary that carries
# no signature at all, and the runner has no identity to give it anyway. macOS therefore
# asks the first time it opens (Open Anyway, as the README's Install section says), and
# Input Monitoring and Accessibility are granted as for any build.
#
# - A push to master, or Run workflow, puts the DMG on a rolling prerelease, "Latest build"
#   (tag `latest-build`), whose assets are replaced each time, so its download link stays
#   the same. The in-app updater offers neither prereleases nor drafts (`ReleaseSpan`), so
#   this never reaches anyone through an update; releases stay `Scripts/release.sh`'s.
# - A pull request builds the DMG and attaches it to the run, for testing; nothing is published.
name: DMG

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# One build at a time per branch; a newer push makes an older run's DMG moot.
concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    permissions:
      contents: write # the "Latest build" prerelease; unused on pull requests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build the DMG
        run: ./Scripts/make-dmg.sh --adhoc
      # build-app.sh --adhoc already fails on a signature with a certificate in it; this says
      # the same about the app as it ships, inside the DMG.
      - name: Check the DMG
        run: |
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${mount}" dist/MacRazer.dmg
          signature="$(codesign -dvv "${mount}/MacRazer.app" 2>&1)"
          hdiutil detach "${mount}"
          echo "${signature}" | grep -E '^(Identifier|Signature|TeamIdentifier)='
          if ! grep -q '^Signature=adhoc' <<<"${signature}" || grep -q '^Authority=' <<<"${signature}"; then
            echo "::error::The app in the DMG is not ad-hoc signed"
            exit 1
          fi
      - name: Name the build
        id: build
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: MacRazer-${{ steps.build.outputs.version }}-${{ steps.build.outputs.short_sha }}
          path: dist/MacRazer.dmg
          if-no-files-found: error
      - name: Publish to "Latest build"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          SHORT_SHA: ${{ steps.build.outputs.short_sha }}
        run: |
          # A file, not `$(cat <<EOF)`: an apostrophe in a heredoc inside `$( )` breaks bash's parse.
          cat > "${RUNNER_TEMP}/notes.md" <<EOF
          An automatic build of ${VERSION} at ${SHORT_SHA}, from ${GITHUB_REF_NAME}. Not a release: for those, see the latest one below this.

          The app has no certificate (it is ad-hoc signed), so the first time it opens macOS says it can't check it. Open it anyway: right-click MacRazer.app in Applications and choose Open, or allow it in System Settings → Privacy & Security. Then grant Input Monitoring, and Accessibility for remaps MacRazer does itself, when it asks.
          EOF
          # The tag follows each build; the release itself is made once and kept.
          git tag -f latest-build "${GITHUB_SHA}"
          git push -f origin refs/tags/latest-build
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --prerelease --title "Latest build (${VERSION}, ${SHORT_SHA})" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create latest-build --prerelease --title "Latest build (${VERSION}, ${SHORT_SHA})" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
          gh release upload latest-build dist/MacRazer.dmg --clobber
