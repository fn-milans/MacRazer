# SPDX-License-Identifier: GPL-2.0-or-later
# Builds the DMG to share with users, by hand: Actions → Release → Run workflow.
#
# The app is ad-hoc signed (`make-dmg.sh --adhoc`), with no certificate of anyone's in it:
# Apple Silicon won't run a binary with no signature at all, and the runner has no identity
# to give it anyway. macOS therefore asks the first time it opens (Open Anyway, as the
# README's Install section says), and Input Monitoring and Accessibility are granted as for
# any build.
#
# The tests run first, so a broken commit never becomes a DMG. The DMGs are attached to the
# run either way. With "Draft release" on, they also go on a draft GitHub release for the
# version in Packaging/Info.plist (bump it with Scripts/release.sh first), which you review
# and publish yourself; nothing is published by this workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Also put the DMGs on a draft release for this version, to review and publish
        type: boolean
        default: true

# One at a time: two runs for the same version would race for the same draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write # the draft release; unused without it
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes are drafted from the history since the last tag.
          fetch-depth: 0
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Read the version
        id: version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building MacRazer ${version} at ${GITHUB_SHA::7}"
      # Before the build, so a version that was already released stops the run in seconds.
      - name: Check the version isn't released yet
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::v${VERSION} is already released. Bump the version with Scripts/release.sh, commit, and run this again."
            exit 1
          fi
      - name: Build the DMG
        run: ./Scripts/make-dmg.sh --adhoc
      # build-app.sh --adhoc already fails on a signature with a certificate in it; this says
      # the same about the app as it ships, inside the DMG.
      - name: Check the DMG
        run: |
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${mount}" dist/MacRazer.dmg
          signature="$(codesign -dvv "${mount}/MacRazer.app" 2>&1)"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${mount}/MacRazer.app/Contents/Info.plist")"
          hdiutil detach "${mount}"
          echo "${signature}" | grep -E '^(Identifier|Signature|TeamIdentifier)='
          if ! grep -q '^Signature=adhoc' <<<"${signature}" || grep -q '^Authority=' <<<"${signature}"; then
            echo "::error::The app in the DMG is not ad-hoc signed"
            exit 1
          fi
          if [ "${built}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::The app in the DMG says ${built}, not ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MacRazer-${{ steps.version.outputs.version }}
          path: |
            dist/MacRazer.dmg
            dist/MacRazer-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error
      - name: Put it on a draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          # A draft to edit, not the finished copy: it carries the changelog entries verbatim.
          if ! ./Scripts/release-notes.sh "${VERSION}" --repo "${GITHUB_REPOSITORY}" > "${RUNNER_TEMP}/notes.md"; then
            cat > "${RUNNER_TEMP}/notes.md" <<EOF
          MacRazer ${VERSION}. See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md).
          EOF
          fi
          assets=(dist/MacRazer.dmg "dist/MacRazer-${VERSION}.dmg")
          if gh release view "${tag}" >/dev/null 2>&1; then
            # A draft from an earlier run: keep its notes, which may have been edited, and
            # replace the DMGs.
            gh release upload "${tag}" "${assets[@]}" --clobber
            gh release edit "${tag}" --target "${GITHUB_SHA}"
          else
            gh release create "${tag}" "${assets[@]}" --draft --target "${GITHUB_SHA}" \
              --title "${tag}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
          echo "Draft release ${tag} is ready to review: https://github.com/${GITHUB_REPOSITORY}/releases"
